<button id="new">New note</button><ul id="side"></ul><textarea id="editor"></textarea><div id="preview"></div>
<script>
let n=JSON.parse(localStorage.n||'[""]'),c=0;const e=document.getElementById('editor');
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/`(.+?)`/g,'<code>$1</code>').replace(/\[(.+?)\]\((.+?)\)/g,'<a href="$2">$1</a>');
function md(s){let o='',ul=false;for(const l of s.split('\n')){if(l.startsWith('- ')){if(!ul){o+='<ul>';ul=true}o+='<li>'+inl(l.slice(2))+'</li>';continue}if(ul){o+='</ul>';ul=false}
const h=l.match(/^(#{1,3}) (.*)/);if(h)o+=`<h${h[1].length}>${inl(h[2])}</h${h[1].length}>`;else if(l.trim())o+='<p>'+inl(l)+'</p>'}return o+(ul?'</ul>':'')}
function draw(){document.getElementById('preview').innerHTML=md(n[c]);document.getElementById('side').innerHTML=n.map(x=>'<li>'+esc(x.split('\n')[0]||'Untitled')+'</li>').join('')}
e.value=n[c];e.oninput=()=>{n[c]=e.value;localStorage.n=JSON.stringify(n);draw()};
document.getElementById('new').onclick=()=>{n.push('');c=n.length-1;e.value='';draw()};draw();
</script>
