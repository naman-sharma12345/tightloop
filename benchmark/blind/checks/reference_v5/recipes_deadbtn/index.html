<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recipe box</title><style>
:root{--bg:#faf7f2;--surface:#fff;--text:#292524;--muted:#78716c;--border:#e7e5e4;--accent:#c2410c}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
h1{font-size:24px;font-weight:600;margin:0}h2{font-size:16px;font-weight:600;margin:0 0 8px}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{height:38px;border:1px solid var(--border);border-radius:8px;padding:0 12px;background:var(--surface);min-width:0}
textarea{height:auto;padding:8px 12px}
button{height:38px;border:1px solid var(--border);border-radius:8px;padding:0 14px;background:var(--surface);cursor:pointer}
button:hover{filter:brightness(.96)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.muted{color:var(--muted)}.empty{color:var(--muted);padding:24px;text-align:center}
.err{color:#dc2626;font-size:14px;min-height:20px}

header{display:flex;gap:16px;align-items:center;padding:16px 24px;border-bottom:1px solid var(--border);background:var(--surface);flex-wrap:wrap}
header h1{margin-right:auto}#search{width:260px}
.wrap{display:grid;grid-template-columns:320px 1fr 360px;gap:24px;padding:24px;align-items:start}
form{padding:16px;display:flex;flex-direction:column;gap:8px}label{font-size:13px;color:var(--muted)}
#recipes{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.recipe{padding:16px;cursor:pointer}.recipe.sel{border-color:var(--accent)}
.recipe-title{font-weight:600;margin:0 0 8px;font-size:16px}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;margin:0 4px 4px 0;background:#e9efe4}
.chip:nth-child(3n+2){background:#f3ead8}.chip:nth-child(3n){background:#f1dfd6}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px}.row button{height:30px;font-size:13px;padding:0 10px}
#recipe-detail{padding:16px}#recipe-detail ul{padding-left:18px}.qty{font-variant-numeric:tabular-nums;font-weight:600}
#scale-servings{width:90px}
@media(max-width:1000px){.wrap{grid-template-columns:1fr}#search{width:100%}}
@media(max-width:560px){#recipes{grid-template-columns:1fr}.wrap{padding:16px}}
</style></head><body>
<header><h1>Recipe box</h1><input id="search" type="search" placeholder="Search title or ingredient" aria-label="Search"><select id="tag-filter" aria-label="Tag filter"></select></header>
<div class="wrap">
<form id="recipe-form" class="card" novalidate><h2 id="form-h">Add a recipe</h2>
<label for="recipe-title">Title</label><input id="recipe-title">
<label for="recipe-servings">Servings</label><input id="recipe-servings" type="number" min="1" step="1" value="2">
<label for="recipe-tags">Tags (comma-separated)</label><input id="recipe-tags">
<label for="recipe-ingredients">Ingredients (one per line)</label><textarea id="recipe-ingredients" rows="5"></textarea>
<label for="recipe-steps">Steps (one per line)</label><textarea id="recipe-steps" rows="4"></textarea>
<div class="err" id="form-err" role="alert"></div>
<div style="display:flex;gap:8px"><button class="primary" id="save-recipe" type="submit">Save recipe</button><button type="button" id="cancel-edit" hidden>Cancel</button><button type="button" id="print-recipes">Print</button></div></form>
<section><div id="recipes"></div></section>
<aside id="recipe-detail" class="card"></aside></div>
<script>
const KEY='recipes.v1';let R=JSON.parse(localStorage.getItem(KEY)||'[]');let editing=null,sel=null,scale=null;
const save=()=>localStorage.setItem(KEY,JSON.stringify(R));const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function parseQ(line){const m=line.match(/^\s*(\d+\s*\/\s*\d+|\d+(?:\.\d+)?|\.\d+)(.*)$/);if(!m)return null;let q=m[1].includes('/')?(([a,b])=>+a/+b)(m[1].split('/')):+m[1];return{q,rest:m[2]}}
const fmt=x=>String(Math.round(x*100)/100);
function renderTags(){const tags=[...new Set(R.flatMap(r=>r.tags))].sort();const f=$('#tag-filter'),v=f.value;
 f.innerHTML='<option value="">All tags</option>'+tags.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join('');f.value=tags.includes(v)?v:''}
function renderList(){const q=$('#search').value.trim().toLowerCase(),t=$('#tag-filter').value;
 const vis=R.filter(r=>(!t||r.tags.includes(t))&&(!q||r.title.toLowerCase().includes(q)||r.ingredients.some(i=>i.toLowerCase().includes(q))));
 $('#recipes').innerHTML=vis.length?vis.map(r=>`<article class="recipe card${r.id===sel?' sel':''}" data-id="${r.id}" tabindex="0"><h3 class="recipe-title">${esc(r.title)}</h3><div>${r.tags.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div><div class="row"><span class="muted">${r.servings} servings</span><span><button class="edit">Edit</button> <button class="delete">Delete</button></span></div></article>`).join('')
 :`<div class="card empty" style="grid-column:1/-1">${R.length?'No recipes match. Try another search or tag.':'No recipes yet. Add your first one with the form.'}</div>`}
function renderDetail(){const r=R.find(x=>x.id===sel),D=$('#recipe-detail');
 if(!r){D.innerHTML='<div class="empty">Pick a recipe to see its ingredients and steps.</div>';return}
 const s=scale||r.servings,k=s/r.servings;
 D.innerHTML=`<h2>${esc(r.title)}</h2><label for="scale-servings">Servings</label> <input id="scale-servings" type="number" min="1" step="1" value="${s}">
 <h2 style="margin-top:16px">Ingredients</h2><ul>${r.ingredients.map(i=>{const p=parseQ(i);return `<li class="ingredient">${p?`<span class="qty">${fmt(p.q*k)}</span>${esc(p.rest)}`:esc(i)}</li>`}).join('')}</ul>
 <h2>Steps</h2><ol>${r.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`;
 $('#scale-servings').addEventListener('input',e=>{const v=parseFloat(e.target.value);if(v>0){scale=v;const k2=v/r.servings;D.querySelectorAll('.ingredient').forEach((li,n)=>{const p=parseQ(r.ingredients[n]);if(p)li.querySelector('.qty').textContent=fmt(p.q*k2)})}})}
function render(){renderTags();renderList();renderDetail()}
const lines=s=>s.split('\n').map(x=>x.trim()).filter(Boolean);
$('#recipe-form').addEventListener('submit',e=>{e.preventDefault();const title=$('#recipe-title').value.trim(),sv=$('#recipe-servings').value.trim();
 if(!title){$('#form-err').textContent='Please give the recipe a title.';return}
 if(!/^\d+$/.test(sv)||+sv<1){$('#form-err').textContent='Servings must be a whole number of 1 or more.';return}
 $('#form-err').textContent='';const o={title,servings:+sv,tags:[...new Set($('#recipe-tags').value.split(',').map(x=>x.trim().toLowerCase()).filter(Boolean))],ingredients:lines($('#recipe-ingredients').value),steps:lines($('#recipe-steps').value)};
 if(editing){Object.assign(R.find(x=>x.id===editing),o);if(sel===editing)scale=null}else R.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),...o});
 editing=null;e.target.reset();$('#recipe-servings').value=2;$('#form-h').textContent='Add a recipe';$('#cancel-edit').hidden=true;save();render()});
$('#cancel-edit').onclick=()=>{editing=null;$('#recipe-form').reset();$('#form-h').textContent='Add a recipe';$('#cancel-edit').hidden=true};
$('#recipes').addEventListener('click',e=>{const c=e.target.closest('.recipe');if(!c)return;const r=R.find(x=>x.id===c.dataset.id);
 if(e.target.closest('.delete')){if(confirm('Delete "'+r.title+'"?')){R=R.filter(x=>x!==r);if(sel===r.id)sel=null;save();render()}return}
 if(e.target.closest('.edit')){editing=r.id;$('#recipe-title').value=r.title;$('#recipe-servings').value=r.servings;$('#recipe-tags').value=r.tags.join(', ');$('#recipe-ingredients').value=r.ingredients.join('\n');$('#recipe-steps').value=r.steps.join('\n');$('#form-h').textContent='Edit recipe';$('#cancel-edit').hidden=false;$('#recipe-title').focus();return}
 sel=r.id;scale=null;renderList();renderDetail()});
$('#recipes').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('recipe'))e.target.click()});
$('#search').addEventListener('input',renderList);$('#tag-filter').addEventListener('change',renderList);
render();
</script></body></html>
