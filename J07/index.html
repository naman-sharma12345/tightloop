<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ledgerly — Invoices</title>
  <meta name="color-scheme" content="light">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f5c50'/%3E%3Cpath d='M10 9h9l4 4v10H10z' fill='none' stroke='%23fff' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M13 17h7M13 20h5' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Icon sprite (inline SVG, stroke icons on a 24px grid) -->
  <svg xmlns="http://www.w3.org/2000/svg" class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-logo" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/><path d="M9 12h7M9 16h5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c2 .6 3.2 2.4 3.5 5.2"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/><path d="M9 12h7M9 16h7"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5"/><path d="M5 20h14"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V4M7 9l5-5 5 5"/><path d="M5 20h14"/></symbol>
    <symbol id="i-database" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M21 3 10 14"/><path d="M21 3l-7 18-4-7-7-4z"/></symbol>
    <symbol id="i-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.7 2.7L16.5 9.5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-printer" viewBox="0 0 24 24"><path d="M7 8V3h10v5"/><rect x="3" y="8" width="18" height="9" rx="2"/><path d="M7 14h10v7H7z"/></symbol>
    <symbol id="i-grip" viewBox="0 0 24 24"><circle cx="9" cy="6" r="1.2"/><circle cx="15" cy="6" r="1.2"/><circle cx="9" cy="12" r="1.2"/><circle cx="15" cy="12" r="1.2"/><circle cx="9" cy="18" r="1.2"/><circle cx="15" cy="18" r="1.2"/></symbol>
    <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
    <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-draft" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" stroke-dasharray="3 3"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-unlock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 7.5-2"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></symbol>
    <symbol id="i-building" viewBox="0 0 24 24"><path d="M4 21V5l8-2v18M12 8l8 2v11"/><path d="M8 8h.01M8 12h.01M8 16h.01M16 13h.01M16 17h.01M2 21h20"/></symbol>
    <symbol id="i-sort" viewBox="0 0 24 24"><path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4"/></symbol>
    <symbol id="i-rewind" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></symbol>
  </svg>

  <a class="skip-link" href="#main">Skip to content</a>

  <header class="app-header">
    <div class="header-inner">
      <a class="brand" href="#/invoices" aria-label="Ledgerly, invoices home">
        <span class="brand-mark"><svg class="icon"><use href="#i-logo"/></svg></span>
        <span class="brand-name">Ledgerly</span>
      </a>
      <nav class="main-nav" aria-label="Main">
        <a href="#/invoices" data-nav="invoices"><svg class="icon"><use href="#i-file"/></svg><span>Invoices</span></a>
        <a href="#/clients" data-nav="clients"><svg class="icon"><use href="#i-users"/></svg><span>Clients</span></a>
      </nav>
      <div class="header-actions">
        <div class="menu-wrap">
          <button type="button" class="btn btn-ghost btn-icon-label" id="data-menu-btn" aria-haspopup="true" aria-expanded="false" aria-controls="data-menu">
            <svg class="icon"><use href="#i-database"/></svg><span class="sr-sm">Data</span><svg class="icon icon-sm hide-sm"><use href="#i-chevron-down"/></svg>
          </button>
          <div class="menu" id="data-menu" hidden>
            <button type="button" class="menu-item" data-action="export-csv"><svg class="icon"><use href="#i-download"/></svg><span><strong>Export invoices as CSV</strong><small>The list as currently filtered</small></span></button>
            <button type="button" class="menu-item" data-action="export-json"><svg class="icon"><use href="#i-download"/></svg><span><strong>Export backup (JSON)</strong><small>Profile, clients and invoices</small></span></button>
            <button type="button" class="menu-item" data-action="import-json"><svg class="icon"><use href="#i-upload"/></svg><span><strong>Import backup (JSON)</strong><small>Replaces everything; you can undo</small></span></button>
          </div>
        </div>
        <button type="button" class="btn btn-ghost btn-icon-label" data-action="open-settings">
          <svg class="icon"><use href="#i-settings"/></svg><span class="sr-sm">Settings</span>
        </button>
      </div>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <div id="banner-slot"></div>
    <div id="app"></div>
  </main>

  <!-- Printable invoice: only visible in @media print -->
  <article id="print-doc" class="print-doc" aria-hidden="true"></article>

  <input type="file" id="import-file" accept="application/json,.json" class="visually-hidden" tabindex="-1" aria-hidden="true">

  <!-- Settings dialog -->
  <dialog id="settings-dialog" class="dialog" aria-labelledby="settings-title">
    <form method="dialog" id="settings-form" novalidate>
      <header class="dialog-head">
        <div>
          <h2 id="settings-title">Business profile</h2>
          <p class="dialog-sub">Used on every new invoice you create.</p>
        </div>
        <button type="button" class="btn btn-ghost btn-icon" data-close aria-label="Close"><svg class="icon"><use href="#i-x"/></svg></button>
      </header>
      <div class="dialog-body">
        <div class="field">
          <label for="p-name">Business name</label>
          <input id="p-name" name="name" type="text" autocomplete="organization" maxlength="120">
        </div>
        <div class="field">
          <label for="p-address">Address</label>
          <textarea id="p-address" name="address" rows="3" autocomplete="street-address" maxlength="400"></textarea>
        </div>
        <div class="field">
          <label for="p-taxid">Tax ID <span class="optional">optional</span></label>
          <input id="p-taxid" name="taxId" type="text" maxlength="60">
        </div>
        <div class="field-row">
          <div class="field">
            <label for="p-currency">Default currency</label>
            <select id="p-currency" name="currency"></select>
          </div>
          <div class="field">
            <label for="p-tax">Default tax rate</label>
            <div class="input-affix"><input id="p-tax" name="taxRate" type="text" inputmode="decimal" aria-describedby="p-tax-err"><span class="affix" aria-hidden="true">%</span></div>
            <p class="field-error" id="p-tax-err" hidden></p>
          </div>
        </div>
      </div>
      <footer class="dialog-foot">
        <button type="button" class="btn btn-secondary" data-close>Cancel</button>
        <button type="submit" class="btn btn-primary"><svg class="icon"><use href="#i-check"/></svg>Save profile</button>
      </footer>
    </form>
  </dialog>

  <!-- Client dialog -->
  <dialog id="client-dialog" class="dialog" aria-labelledby="client-title">
    <form method="dialog" id="client-form" novalidate>
      <header class="dialog-head">
        <div>
          <h2 id="client-title">New client</h2>
          <p class="dialog-sub">Who you're billing.</p>
        </div>
        <button type="button" class="btn btn-ghost btn-icon" data-close aria-label="Close"><svg class="icon"><use href="#i-x"/></svg></button>
      </header>
      <div class="dialog-body">
        <div class="field">
          <label for="c-name">Name <span class="req" aria-hidden="true">required</span></label>
          <input id="c-name" name="name" type="text" required aria-required="true" maxlength="120" aria-describedby="c-name-err" autocomplete="off">
          <p class="field-error" id="c-name-err" hidden></p>
        </div>
        <div class="field">
          <label for="c-email">Email <span class="optional">optional</span></label>
          <input id="c-email" name="email" type="email" maxlength="160" aria-describedby="c-email-err" autocomplete="off">
          <p class="field-error" id="c-email-err" hidden></p>
        </div>
        <div class="field">
          <label for="c-address">Billing address <span class="optional">optional</span></label>
          <textarea id="c-address" name="address" rows="3" maxlength="400"></textarea>
        </div>
      </div>
      <footer class="dialog-foot">
        <button type="button" class="btn btn-secondary" data-close>Cancel</button>
        <button type="submit" class="btn btn-primary"><svg class="icon"><use href="#i-check"/></svg><span id="client-submit-label">Add client</span></button>
      </footer>
    </form>
  </dialog>

  <!-- Mark as paid dialog -->
  <dialog id="paid-dialog" class="dialog dialog-sm" aria-labelledby="paid-title">
    <form method="dialog" id="paid-form" novalidate>
      <header class="dialog-head">
        <div>
          <h2 id="paid-title">Mark as paid</h2>
          <p class="dialog-sub" id="paid-sub">The invoice becomes read-only until you reopen it.</p>
        </div>
        <button type="button" class="btn btn-ghost btn-icon" data-close aria-label="Close"><svg class="icon"><use href="#i-x"/></svg></button>
      </header>
      <div class="dialog-body">
        <div class="field">
          <label for="paid-date">Paid on</label>
          <input id="paid-date" name="paidDate" type="date" required aria-describedby="paid-date-err">
          <p class="field-error" id="paid-date-err" hidden></p>
        </div>
      </div>
      <footer class="dialog-foot">
        <button type="button" class="btn btn-secondary" data-close>Cancel</button>
        <button type="submit" class="btn btn-success"><svg class="icon"><use href="#i-check-circle"/></svg>Mark as paid</button>
      </footer>
    </form>
  </dialog>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <div class="visually-hidden" id="announcer" aria-live="assertive"></div>

  <script src="app.js"></script>
</body>
</html>
