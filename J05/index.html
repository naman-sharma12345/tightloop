<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Tend — Habit tracker</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="shell">
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21v-9"/><path d="M12 12c0-4.4 3-7.5 8-7.5 0 5-3.2 8-8 7.5z"/><path d="M12 15c0-3.3-2.3-5.5-6.5-5.5 0 3.5 2.4 5.7 6.5 5.5z"/></svg>
        </span>
        <div>
          <h1 class="brand-name">Tend</h1>
          <p class="brand-date" id="today-date"></p>
        </div>
      </div>

      <div class="toolbar" role="toolbar" aria-label="Habit actions">
        <button type="button" class="btn btn-ghost" id="undo-btn" data-action="undo" disabled aria-keyshortcuts="Control+Z Meta+Z">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
          <span>Undo</span>
        </button>
        <button type="button" class="btn btn-ghost" id="export-btn" data-action="export">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/></svg>
          <span>Export</span>
        </button>
        <button type="button" class="btn btn-ghost" id="import-btn" data-action="import" aria-describedby="data-msg">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20V9"/><path d="m7 14 5-5 5 5"/><path d="M5 4h14"/></svg>
          <span>Import</span>
        </button>
        <input type="file" id="import-file" accept="application/json,.json" hidden>
        <button type="button" class="btn btn-primary" id="new-btn" data-action="new" aria-keyshortcuts="N">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
          <span>New habit</span>
          <kbd class="kbd" aria-hidden="true">N</kbd>
        </button>
      </div>
    </header>

    <div id="data-msg" class="data-msg" role="alert"></div>
    <div id="notice" role="status"></div>

    <main id="main" class="layout" tabindex="-1">
      <section class="panel today-panel" aria-labelledby="today-title">
        <div id="today"></div>
      </section>

      <div class="side">
        <section class="habits-section" aria-labelledby="habits-title">
          <div class="section-head">
            <h2 id="habits-title" class="section-title" tabindex="-1">Your habits</h2>
            <p class="section-sub">Last 12 weeks. Click a day to fix the record.</p>
          </div>
          <div id="habits"></div>
        </section>

        <section class="archived-section" aria-labelledby="archived-title">
          <div class="section-head">
            <h2 id="archived-title" class="section-title" tabindex="-1">Archived</h2>
          </div>
          <div id="archived"></div>
        </section>
      </div>
    </main>

    <footer class="app-footer">
      <p>Shortcuts: <kbd class="kbd">N</kbd> new habit · <kbd class="kbd">↑</kbd><kbd class="kbd">↓</kbd> move on Today · <kbd class="kbd">Space</kbd> check · <kbd class="kbd">Ctrl</kbd>/<kbd class="kbd">⌘</kbd>+<kbd class="kbd">Z</kbd> undo</p>
      <p>Everything stays in this browser.</p>
    </footer>
  </div>

  <dialog id="habit-dialog" class="dialog" aria-labelledby="dialog-title">
    <form id="habit-form" novalidate>
      <div class="dialog-head">
        <h2 id="dialog-title">New habit</h2>
        <button type="button" class="icon-btn" data-close aria-label="Close">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6 6 18"/></svg>
        </button>
      </div>

      <div class="dialog-body">
        <div class="field">
          <label for="f-name" class="label">Name</label>
          <input id="f-name" name="name" class="input" type="text" autocomplete="off" spellcheck="false"
                 placeholder="e.g. Read 10 pages" aria-describedby="name-err name-count">
          <div class="field-foot">
            <p id="name-err" class="field-error" hidden></p>
            <span id="name-count" class="count" aria-live="off">0/60</span>
          </div>
        </div>

        <fieldset class="field">
          <legend class="label">Colour</legend>
          <div class="swatches" id="swatches"></div>
        </fieldset>

        <fieldset class="field">
          <legend class="label">Schedule</legend>
          <div class="segmented" id="schedule-type">
            <label class="seg"><input type="radio" name="stype" value="daily" checked><span>Every day</span></label>
            <label class="seg"><input type="radio" name="stype" value="weekdays"><span>Chosen days</span></label>
            <label class="seg"><input type="radio" name="stype" value="weekly"><span>Times a week</span></label>
          </div>

          <div class="sched-panel" id="days-panel" hidden>
            <div class="days" role="group" aria-label="Days of the week" aria-describedby="days-err" id="days"></div>
            <p id="days-err" class="field-error" hidden></p>
          </div>

          <div class="sched-panel" id="times-panel" hidden>
            <label for="f-times" class="label label-sm">How many times per week?</label>
            <select id="f-times" class="input select">
              <option value="1">Once a week</option>
              <option value="2">Twice a week</option>
              <option value="3" selected>3 times a week</option>
              <option value="4">4 times a week</option>
              <option value="5">5 times a week</option>
              <option value="6">6 times a week</option>
              <option value="7">7 times a week</option>
            </select>
          </div>
        </fieldset>
      </div>

      <div class="dialog-foot">
        <button type="button" class="btn btn-ghost" data-close>Cancel</button>
        <button type="submit" class="btn btn-primary" id="dialog-submit">Add habit</button>
      </div>
    </form>
  </dialog>

  <div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

  <script src="app.js"></script>
</body>
</html>
