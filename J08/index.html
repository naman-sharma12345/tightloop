<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wayfare · Trip planner</title>
  <meta name="color-scheme" content="light">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232c5b50'/%3E%3Cpath d='M15.5 8.5l-2 5-5 2 2-5z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-food" viewBox="0 0 24 24"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-1.7 0-3 2.2-3 5.5 0 2.4 1.3 3.5 3 3.5v9"/></symbol>
      <symbol id="i-sight" viewBox="0 0 24 24"><path d="M4 8.5h3l1.8-3h6.4l1.8 3h3v10.5H4z"/><circle cx="12" cy="13.5" r="3.3"/></symbol>
      <symbol id="i-transport" viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="14" rx="3"/><path d="M6 10.5h12M9 21l1.5-4M15 21l-1.5-4M9.5 14h.01M14.5 14h.01"/></symbol>
      <symbol id="i-stay" viewBox="0 0 24 24"><path d="M3 19V6M3 15h18v4M21 15v-2.5A3.5 3.5 0 0 0 17.5 9H11v6"/><circle cx="7" cy="11.5" r="2"/></symbol>
      <symbol id="i-other" viewBox="0 0 24 24"><path d="M12 3.5l2.4 5.3 5.6.7-4.2 3.8 1.1 5.6L12 16.1l-4.9 2.8 1.1-5.6L4 9.5l5.6-.7z"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
      <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
      <symbol id="i-redo" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V5M7 10l5-5 5 5M5 20h14"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 4.3L2.6 18a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 4.3a2 2 0 0 0-3.4 0z"/><path d="M12 9.5v4.5M12 17.5h.01"/></symbol>
      <symbol id="i-move" viewBox="0 0 24 24"><path d="M3.5 12h12M11.5 7l5 5-5 5M20.5 4.5v15"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0 1 13 0c0 5-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></symbol>
      <symbol id="i-wallet" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18M16 14.5h2"/></symbol>
      <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M3 13l2.5-8h13L21 13v6H3z"/><path d="M3 13h5l1.5 2.5h5L16 13h5"/></symbol>
      <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-logo" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></symbol>
      <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.5h.01"/></symbol>
    </defs>
  </svg>

  <a class="skip-link" href="#main">Skip to the itinerary</a>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="./" aria-label="Wayfare, trip planner home">
        <span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="#i-logo"></use></svg></span>
        <span class="brand-name">Wayfare</span>
      </a>
      <div class="trip-switch" id="tripSwitch" hidden>
        <label for="tripSelect" class="sr-only">Current trip</label>
        <select id="tripSelect" class="select select-quiet"></select>
      </div>
      <div class="topbar-actions">
        <button type="button" class="btn btn-icon btn-quiet" id="undoBtn" data-action="undo" aria-label="Undo" disabled>
          <svg class="icon" aria-hidden="true"><use href="#i-undo"></use></svg>
        </button>
        <button type="button" class="btn btn-icon btn-quiet" id="redoBtn" data-action="redo" aria-label="Redo" disabled>
          <svg class="icon" aria-hidden="true"><use href="#i-redo"></use></svg>
        </button>
        <span class="topbar-divider" aria-hidden="true"></span>
        <button type="button" class="btn btn-quiet" data-action="import" data-key="import-top">
          <svg class="icon" aria-hidden="true"><use href="#i-upload"></use></svg><span class="hide-sm">Import</span><span class="sr-only"> a trip from JSON</span>
        </button>
        <button type="button" class="btn btn-primary" data-action="new-trip" data-key="new-trip">
          <svg class="icon" aria-hidden="true"><use href="#i-plus"></use></svg><span>New trip</span>
        </button>
      </div>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
    </div>
  </header>

  <div class="notices">
    <div class="banner" id="banner" role="status" hidden>
      <svg class="icon" aria-hidden="true"><use href="#i-info"></use></svg>
      <p class="banner-text"></p>
      <button type="button" class="btn btn-quiet btn-sm" data-action="dismiss-banner">Dismiss</button>
    </div>
    <div class="banner banner-error" id="importError" role="alert" hidden>
      <svg class="icon" aria-hidden="true"><use href="#i-alert"></use></svg>
      <p class="banner-text"></p>
      <button type="button" class="btn btn-quiet btn-sm" data-action="dismiss-import-error">Dismiss</button>
    </div>
  </div>

  <main id="main" tabindex="-1">
    <section class="empty-app" id="emptyApp" hidden aria-labelledby="emptyTitle">
      <div class="empty-art" aria-hidden="true">
        <svg viewBox="0 0 160 120" width="160" height="120">
          <rect x="8" y="14" width="144" height="92" rx="16" fill="#fff" stroke="#e3dfd5"/>
          <path d="M30 86c18-30 34 6 52-22s34-8 48-34" fill="none" stroke="#2c5b50" stroke-width="2.5" stroke-dasharray="5 6" stroke-linecap="round"/>
          <circle cx="30" cy="86" r="6" fill="#e5efeb" stroke="#2c5b50" stroke-width="2"/>
          <path d="M130 22c-6 0-10 4.5-10 10 0 7 10 16 10 16s10-9 10-16c0-5.5-4-10-10-10z" fill="#2c5b50"/>
          <circle cx="130" cy="32" r="3.5" fill="#fff"/>
        </svg>
      </div>
      <h1 id="emptyTitle" tabindex="-1" data-key="empty-title">Plan your first trip</h1>
      <p class="lede">You don’t have any trips yet. Create one to lay out each day, spot clashes, keep an eye on the budget and settle up with your travel companions.</p>
      <div class="empty-actions">
        <button type="button" class="btn btn-primary btn-lg" data-action="new-trip" data-key="new-trip-empty">
          <svg class="icon" aria-hidden="true"><use href="#i-plus"></use></svg><span>Create a trip</span>
        </button>
        <button type="button" class="btn btn-secondary btn-lg" data-action="import" data-key="import-empty">
          <svg class="icon" aria-hidden="true"><use href="#i-upload"></use></svg><span>Import a trip (.json)</span>
        </button>
      </div>
    </section>

    <div class="trip-view" id="tripView" hidden>
      <section class="trip-head" id="tripHead" aria-label="Trip overview"></section>

      <div class="toolbar">
        <div class="search">
          <label for="search" class="sr-only">Search activities by title or place</label>
          <svg class="icon search-icon" aria-hidden="true"><use href="#i-search"></use></svg>
          <input type="search" id="search" class="input search-input" placeholder="Search by title or place" autocomplete="off" aria-describedby="searchStatus">
          <button type="button" class="btn btn-icon btn-quiet search-clear" data-action="clear-search" aria-label="Clear search" hidden>
            <svg class="icon" aria-hidden="true"><use href="#i-x"></use></svg>
          </button>
        </div>
        <p class="search-status" id="searchStatus" aria-live="polite"></p>
        <button type="button" class="btn btn-primary toolbar-add" data-action="add" data-key="add-toolbar">
          <svg class="icon" aria-hidden="true"><use href="#i-plus"></use></svg><span>Add activity</span>
        </button>
      </div>

      <div class="layout">
        <div class="plan">
          <section class="tray" id="tray" data-drop="" aria-labelledby="trayTitle"></section>
          <div class="board" id="board" role="region" aria-label="Itinerary, one column per day" tabindex="0"></div>
        </div>
        <aside class="budget" id="budget" aria-labelledby="budgetTitle"></aside>
      </div>
    </div>
  </main>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <div class="menu" id="moveMenu" hidden></div>
  <dialog id="tripDialog" aria-labelledby="tripDlgTitle"></dialog>
  <dialog id="activityDialog" aria-labelledby="actDlgTitle"></dialog>

  <script src="app.js"></script>
</body>
</html>
