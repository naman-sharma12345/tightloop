<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Invoices · Folio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232d5a4d'/%3E%3Cpath d='M11 9h10M11 15h10M11 21h6' stroke='%23fff' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Icon sprite (stroke icons on a 24px grid) -->
  <svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4.5A1.5 1.5 0 0 1 9.5 3h5A1.5 1.5 0 0 1 16 4.5V6M18.5 6l-.8 13.2A2 2 0 0 1 15.7 21H8.3a2 2 0 0 1-2-1.8L5.5 6M10 11v5M14 11v5"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/><path d="m14.5 5.5 3 3"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="m21 3-7.5 18-3.2-7.3L3 10.5Z"/><path d="M21 3 10.3 13.7"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8.5 12.2 2.4 2.4 4.8-5"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5"/><circle cx="12" cy="16.2" r=".9" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-grip" viewBox="0 0 24 24"><g fill="currentColor" stroke="none"><circle cx="9" cy="6" r="1.4"/><circle cx="15" cy="6" r="1.4"/><circle cx="9" cy="12" r="1.4"/><circle cx="15" cy="12" r="1.4"/><circle cx="9" cy="18" r="1.4"/><circle cx="15" cy="18" r="1.4"/></g></symbol>
    <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5M11 18l-6-6 6-6"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.4-4.4"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M4 17v1.5A2.5 2.5 0 0 0 6.5 21h11a2.5 2.5 0 0 0 2.5-2.5V17"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M4 17v1.5A2.5 2.5 0 0 0 6.5 21h11a2.5 2.5 0 0 0 2.5-2.5V17"/></symbol>
    <symbol id="i-printer" viewBox="0 0 24 24"><path d="M7 9V3.5h10V9M7 17.5H5A2 2 0 0 1 3 15.5v-4.5A2 2 0 0 1 5 9h14a2 2 0 0 1 2 2v4.5a2 2 0 0 1-2 2h-2"/><path d="M7 14h10v7H7z"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4.5A1.5 1.5 0 0 1 3 13.5v-9A1.5 1.5 0 0 1 4.5 3h9A1.5 1.5 0 0 1 15 4.5V5"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.2a6.5 6.5 0 0 1 3.5 5.8"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4.5" y="10.5" width="15" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-unlock" viewBox="0 0 24 24"><rect x="4.5" y="10.5" width="15" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 7.7-1.5"/></symbol>
    <symbol id="i-building" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="1.5"/><path d="M10 21v-3.5h4V21M9 7h.01M12 7h.01M15 7h.01M9 10.5h.01M12 10.5h.01M15 10.5h.01M9 14h.01M12 14h.01M15 14h.01"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6.5 8.5 6 8.5-6"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11Z"/><circle cx="12" cy="10" r="2.3"/></symbol>
    <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M3 13.5 5.6 5.8A2 2 0 0 1 7.5 4.5h9a2 2 0 0 1 1.9 1.3L21 13.5V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M3 13.5h5l1.5 2.5h5l1.5-2.5h5"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r=".9" fill="currentColor"/><circle cx="4.5" cy="12" r=".9" fill="currentColor"/><circle cx="4.5" cy="18" r=".9" fill="currentColor"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5"/><circle cx="12" cy="7.8" r=".9" fill="currentColor" stroke="none"/></symbol>
  </svg>

  <button type="button" class="skip-link" data-action="skip">Skip to content</button>

  <header class="app-bar">
    <div class="app-bar-inner">
      <a class="brand" href="#/invoices">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><rect width="32" height="32" rx="9" fill="currentColor"/><path d="M11 10h10M11 16h10M11 22h6" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>
        <span class="brand-name">Folio</span>
      </a>
      <nav class="nav" aria-label="Main">
        <a class="nav-link" href="#/invoices" data-nav="invoices"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-file"></use></svg><span>Invoices</span></a>
        <a class="nav-link" href="#/clients" data-nav="clients"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-users"></use></svg><span>Clients</span></a>
      </nav>
      <button type="button" class="btn btn-ghost settings-btn" id="btn-settings" data-action="open-settings">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-sliders"></use></svg><span class="settings-label">Business profile</span>
      </button>
    </div>
  </header>

  <div id="notice" class="container notice-wrap"></div>

  <main id="main" class="container" tabindex="-1"></main>

  <div id="print-doc" class="print-doc" aria-hidden="true"></div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <div id="announcer" class="sr-only" aria-live="polite"></div>
  <input type="file" id="import-file" class="sr-only" accept="application/json,.json" tabindex="-1" aria-hidden="true">

  <!-- Business profile -->
  <dialog id="dlg-settings" class="dialog" aria-labelledby="dlg-settings-title" aria-describedby="dlg-settings-desc">
    <form class="dialog-panel" id="form-settings" novalidate>
      <header class="dialog-head">
        <div>
          <h2 id="dlg-settings-title">Business profile</h2>
          <p class="dialog-sub" id="dlg-settings-desc">Set this once. It appears on every invoice and new invoices start with your defaults.</p>
        </div>
        <button type="button" class="icon-btn" data-close aria-label="Close"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-x"></use></svg></button>
      </header>
      <div class="dialog-body">
        <div class="field">
          <label for="s-name">Business name</label>
          <input id="s-name" autocomplete="organization">
        </div>
        <div class="field">
          <label for="s-address">Address</label>
          <textarea id="s-address" rows="3" autocomplete="street-address"></textarea>
        </div>
        <div class="field">
          <label for="s-taxid">Tax ID <span class="opt">optional</span></label>
          <input id="s-taxid" autocomplete="off" spellcheck="false">
        </div>
        <div class="field-row">
          <div class="field">
            <label for="s-currency">Default currency</label>
            <select id="s-currency" class="currency-options"></select>
          </div>
          <div class="field">
            <label for="s-taxrate">Default tax rate</label>
            <div class="affix">
              <input id="s-taxrate" inputmode="decimal" autocomplete="off" aria-describedby="s-taxrate-err">
              <span class="suffix" aria-hidden="true">%</span>
            </div>
            <p class="field-error" id="s-taxrate-err" hidden></p>
          </div>
        </div>
      </div>
      <footer class="dialog-foot">
        <button type="button" class="btn btn-secondary" data-close>Cancel</button>
        <button type="submit" class="btn btn-primary"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-check"></use></svg><span>Save profile</span></button>
      </footer>
    </form>
  </dialog>

  <!-- Client -->
  <dialog id="dlg-client" class="dialog" aria-labelledby="dlg-client-title">
    <form class="dialog-panel" id="form-client" novalidate>
      <header class="dialog-head">
        <div>
          <h2 id="dlg-client-title">New client</h2>
          <p class="dialog-sub">Only the name is required.</p>
        </div>
        <button type="button" class="icon-btn" data-close aria-label="Close"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-x"></use></svg></button>
      </header>
      <div class="dialog-body">
        <div class="field">
          <label for="c-name">Name <span class="req">required</span></label>
          <input id="c-name" autocomplete="off" aria-describedby="c-name-err" required>
          <p class="field-error" id="c-name-err" hidden></p>
        </div>
        <div class="field">
          <label for="c-email">Email <span class="opt">optional</span></label>
          <input id="c-email" type="email" autocomplete="off" spellcheck="false" aria-describedby="c-email-err">
          <p class="field-error" id="c-email-err" hidden></p>
        </div>
        <div class="field">
          <label for="c-address">Billing address <span class="opt">optional</span></label>
          <textarea id="c-address" rows="3"></textarea>
        </div>
      </div>
      <footer class="dialog-foot">
        <button type="button" class="btn btn-secondary" data-close>Cancel</button>
        <button type="submit" class="btn btn-primary"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-check"></use></svg><span>Save client</span></button>
      </footer>
    </form>
  </dialog>

  <!-- Mark as paid -->
  <dialog id="dlg-paid" class="dialog dialog-sm" aria-labelledby="dlg-paid-title" aria-describedby="dlg-paid-desc">
    <form class="dialog-panel" id="form-paid" novalidate>
      <header class="dialog-head">
        <div>
          <h2 id="dlg-paid-title">Mark as paid</h2>
          <p class="dialog-sub" id="dlg-paid-desc">The invoice will be locked. You can reopen it later.</p>
        </div>
        <button type="button" class="icon-btn" data-close aria-label="Close"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-x"></use></svg></button>
      </header>
      <div class="dialog-body">
        <div class="field">
          <label for="p-date">Paid on</label>
          <input id="p-date" type="date" aria-describedby="p-date-err" required>
          <p class="field-error" id="p-date-err" hidden></p>
        </div>
      </div>
      <footer class="dialog-foot">
        <button type="button" class="btn btn-secondary" data-close>Cancel</button>
        <button type="submit" class="btn btn-primary"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-check"></use></svg><span>Mark as paid</span></button>
      </footer>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
